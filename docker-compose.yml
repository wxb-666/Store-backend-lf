
services:
  # 前端开发服务：源代码挂载后可由 Vite 自动热更新。
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: Store-backend-frontend
    working_dir: /app
    volumes:
      - ./fe:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    restart: unless-stopped

  # 后端开发服务：通过 Uvicorn 运行 FastAPI，并在代码变更后自动重载。
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: Store-backend-backend
    working_dir: /app
    environment:
      # 数据库连接信息从 .env 文件里面获取
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./be:/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  database:
    image: mysql:8.0
    container_name: Store-backend-mysql
    restart: unless-stopped
    # 数据库连接信息从 .env 文件里面获取
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frontend_node_modules:
  mysql_data:
