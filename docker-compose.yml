
services:

  # 前端容器：Vue 3 + Vite
  frontend:
    image: node:24-alpine
    container_name: Store-backend-frontend
    working_dir: /app

    volumes:
      - ./fe:/app
      - frontend_node_modules:/app/node_modules

    ports:
      - "5173:5173"

    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

    restart: unless-stopped


  # 后端容器：Python
  # 暂时只创建运行环境，不开发 API
  backend:
    image: python:3.12-slim  # 配置最简单的python环境就好，如果后面需要其他软件包再继续安装
    container_name: Store-backend-backend
    working_dir: /app

    volumes:
      - ./be:/app

    ports:
      - "8000:8000"

    command: ["sh", "-c", "while true; do sleep 3600; done"]

    restart: unless-stopped


# Docker 数据卷
volumes:
  frontend_node_modules:
