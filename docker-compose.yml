
services:
  # 前端开发服务：源代码挂载后可由 Vite 自动热更新。
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: Store-backend-frontend
    working_dir: /app
    volumes:
      - ./fe:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    restart: unless-stopped

  # 后端开发运行环境：API 实现后在 be/Dockerfile 中补充依赖与启动命令。
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: Store-backend-backend
    working_dir: /app
    volumes:
      - ./be:/app
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  frontend_node_modules:
